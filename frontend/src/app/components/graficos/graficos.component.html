<div class="graficos">
  <h2>Gráficos</h2>

  <div class="charts-wrapper">
    <div class="chart-card">
      <p-card styleClass="chart-card-content">
        <ng-template pTemplate="header">
          <h3 class="chart-title">Distribuição de Categorias</h3>
        </ng-template>
        <div class="chart-container">
          <canvas #pieChart></canvas>
        </div>
      </p-card>
    </div>

    <div class="chart-card">
      <p-card styleClass="chart-card-content">
        <ng-template pTemplate="header">
          <h3 class="chart-title">Sentimentos por Categoria</h3>
        </ng-template>
        <div class="chart-container">
          <p-select
            [options]="categorias"
            [(ngModel)]="categoriaSelecionada"
            (onChange)="atualizarGraficoSentimentosCategoria()"
            placeholder="Selecione uma categoria"
            class="w-full mb-3"
          ></p-select>
          <canvas #barChart></canvas>
        </div>
      </p-card>
    </div>

    <div class="chart-card">
      <p-card styleClass="chart-card-content">
        <ng-template pTemplate="header">
          <h3 class="chart-title">Volume Mensal de Tweets</h3>
        </ng-template>
        <div class="chart-container">
          <p-select
            [options]="anosDisponiveis"
            [(ngModel)]="anoSelecionado"
            (onChange)="atualizarGraficoMensalPorAno()"
            placeholder="Selecione um ano"
            class="w-full mb-3"
          ></p-select>
          <canvas #lineChart></canvas>
        </div>
      </p-card>
    </div>
  </div>

  <p-confirmPopup></p-confirmPopup>
</div>
